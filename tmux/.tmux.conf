set -g mouse on

##### Scrollback / history
set -g history-limit 30000

##### Alternate screen (usually on by default; keep if you want explicit)
setw -g alternate-screen on

##### Faster Escape handling
set -s escape-time 50

##### Terminal / terminfo (recommended for modern tmux)
set -g default-terminal "tmux-256color"

# Wheel-up: if not already in a mode, enter copy-mode and start scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
  "send-keys -M" \
  "select-pane -t= \; copy-mode -e \; send-keys -M"

# Wheel-down: scroll down (stays in copy-mode until it reaches bottom with -e)
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Copy selected text
set -s set-clipboard on
setw -g mode-keys vi

# Copy with mouse selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"

# Copy with 'y' in vi-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"

bind -T root MouseDrag1Pane copy-mode -M

set -g extended-keys on
set -g extended-keys-format csi-u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
